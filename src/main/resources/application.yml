server:
  port: 8086

spring:
  application:
    name: ms-campuslab-rabbitmq-admin

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI:https://login.microsoftonline.com/c75374e8-15d8-446b-8c6c-291120e0c761/v2.0}

# Cluster RabbitMQ (ec2-mq): la Management API vive en el puerto 15672 del
# mismo host donde escucha AMQP en el 5672. Credenciales de administracion
# del broker (no confundir con las credenciales AMQP de los productores).
campuslab:
  rabbitmq:
    management-url: http://${RABBITMQ_HOST:100.26.43.133}:${RABBITMQ_MANAGEMENT_PORT:15672}
    management-username: ${RABBITMQ_USERNAME:admin}
    management-password: ${RABBITMQ_PASSWORD:admin_dev}
    vhost: ${RABBITMQ_VHOST:/}
    # Topologia de la que dependen bookings y notify: RabbitAdminService
    # rechaza (409) actualizarla o eliminarla desde esta API. Lista separada
    # por comas (se inyecta con @Value).
    protected-resources: ${RABBITMQ_PROTECTED_RESOURCES:cmd.direct,cmd.topic,cmd.dlx,q.cmd.email,q.cmd.prep,q.cmd.voucher,q.cmd.email.dlq,q.cmd.prep.dlq,q.cmd.voucher.dlq}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.campuslab.rabbitmqadmin: INFO
